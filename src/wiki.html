<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapweave Wiki</title>
    <link rel="stylesheet" href="./wiki.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="wiki-header">
          <h1><a href="#/">Mapweave Wiki</a></h1>
          <button id="toggle-map-btn" type="button">View Map</button>
          <button id="open-folder-btn" type="button">Open wiki folder…</button>
          <span id="live-indicator"></span>
        </div>
        <select id="era-select" hidden data-tip="Filter the wiki to one era of the timeline"></select>
        <input id="search" type="search" placeholder="Filter entities…" />
        <nav id="entity-list"></nav>
        <button id="toggle-graph-btn" type="button">Show graph</button>
      </aside>
      <main id="content"></main>
      <div id="graph-panel" hidden>
        <svg id="graph-svg"></svg>
      </div>
      <div id="map-panel" hidden>
        <div id="map-panel-header">
          <span>Map</span>
          <button id="map-panel-close" type="button" aria-label="Close">✕</button>
        </div>
        <iframe id="map-panel-frame" title="Mapweave Map"></iframe>
      </div>
    </div>
    <script type="module" src="./wiki-main.ts"></script>
  </body>
</html>
