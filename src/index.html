<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapweave Wiki</title>
    <meta
      name="description"
      content="Mapweave: a worldbuilding wiki — lore, quests, NPCs, and a generated fantasy map, all cross-linked."
    />
    <link rel="icon" type="image/png" href="images/icons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="images/icons/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="images/icons/maskable_icon_x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./wiki.css" />
  </head>
  <body>
    <div id="loading-bar" hidden></div>
    <div id="app">
      <aside id="sidebar">
        <div id="wiki-header">
          <h1><a href="#/">Mapweave Wiki</a></h1>
          <nav id="scenario-nav">
            <a href="#/quests">Quests</a>
            <a href="#/sessions">Sessions</a>
            <a href="#/timeline">Timeline</a>
          </nav>
          <button id="toggle-map-btn" type="button">View Map</button>
          <div id="world-switcher">
            <button id="world-switcher-btn" type="button" data-tip="Switch to a different world">
              <span id="world-switcher-label">Choose a world…</span>
            </button>
            <div id="world-menu" hidden></div>
          </div>
        </div>
        <select id="era-select" hidden data-tip="Filter the wiki to one era of the timeline"></select>
        <button
          id="view-mode-btn"
          type="button"
          data-tip="Toggle whether secret pages/sections are shown — flip to Player view before sharing your screen"
        ></button>
        <button id="new-page-btn" type="button">+ New page</button>
        <div id="search-row">
          <input id="search" type="search" placeholder="Filter entities…" />
          <span id="search-count" class="muted"></span>
        </div>
        <nav id="entity-list"></nav>
        <button id="toggle-graph-btn" type="button">Show graph</button>
      </aside>
      <main id="content"></main>
      <div id="graph-panel" hidden>
        <svg id="graph-svg"></svg>
      </div>
      <div id="map-panel" hidden>
        <div id="map-panel-header">
          <span>Map</span>
          <button id="map-panel-close" type="button" aria-label="Back to the wiki">✕</button>
        </div>
        <div id="map-panel-mount"></div>
      </div>
    </div>
    <script type="module" src="./wiki-main.ts"></script>
  </body>
</html>
